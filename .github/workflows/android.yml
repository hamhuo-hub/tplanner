name: Android Build

# 触发条件：
#   1. 推送 PUKEKO_* / mobile_* 标签 → 构建 APK 并上传到 GitHub Release
#   2. 手动触发（Actions 页面点 "Run workflow"）→ 只构建、上传产物，便于测试
on:
  push:
    branches:
      - '**'
    tags:
      - 'PUKEKO_*'
      - 'mobile_*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Test, lint, and build debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1

      - name: Run unit tests, lint, and debug builds
        run: gradle testDebugUnitTest lintDebug assembleDebug

  build:
    name: Build Android APK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.1   # 与 gradle/wrapper/gradle-wrapper.properties 保持一致

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AMAP_KEY: ${{ secrets.AMAP_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail

          # 签名是 CI 发布的硬性要求，禁止在 secret 缺失时回退到 debug 证书。
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret ${name} is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # 如果 key password 与 store password 相同，可不配置独立的 ANDROID_KEY_PASSWORD。
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > tplanner.keystore
          keytool -list \
            -keystore tplanner.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat > keystore.properties << EOF
          storeFile=../tplanner.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          # 生成 local.properties（仅当 secret 存在时）
          if [ -n "$AMAP_KEY" ] || [ -n "$DEEPSEEK_KEY" ]; then
            cat > local.properties << EOF
          amap.api.key=${AMAP_KEY}
          deepseek.api.key=${DEEPSEEK_KEY}
          EOF
          fi

      - name: Build release APK
        run: gradle assembleRelease

      - name: Verify release APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in ANDROID_HOME"
            exit 1
          fi

          for apk in app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk; do
            if [ ! -f "$apk" ] || [[ "$apk" == *-unsigned.apk ]]; then
              echo "::error::Missing signed release APK: ${apk}"
              exit 1
            fi
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tplanner-android
          path: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # 仅在 tag 触发时发布
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tplanner-android
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/**/*
          # 自动使用内置的 GITHUB_TOKEN，无需额外配置 PAT
