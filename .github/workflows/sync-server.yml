name: Sync Server Checks

# sync_server 的 JavaScript 与部署脚本语法检查。
on:
  push:
    branches:
      - 'sync_server'
    paths:
      - 'sync-server/**'
      - 'sync-v3/**'
      - '.github/workflows/sync-server.yml'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: sync-server syntax checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Syntax-check deploy shell scripts
        run: bash -n deploy/*.sh
