# tPlanner Sync V3 — single-node NATS JetStream
# NATS 只监听 127.0.0.1,不暴露到局域网/互联网;只有同机的 API 与 State Builder 能连接。
# 手机 / PC / Web 不持有 NATS 凭据,一律走 HTTPS API。

host: 127.0.0.1
port: 4222

server_name: tplanner-pi

# 监控端口仅本机
http: 127.0.0.1:8222

# install.sh 会用随机密码替换占位符,并写入 deploy/nats.creds(600)
authorization {
  users: [
    { user: "tplanner", password: "__TPLANNER_PASSWORD_PLACEHOLDER__" }
  ]
}

jetstream {
  store_dir: "/var/lib/tplanner-sync/jetstream"
  max_memory_store: 64M
  max_file_store: 1G
}

# 建议放置于 SSD 而非 SD 卡;命令流保留策略由应用层创建 stream 时指定
# (TPLANNER_COMMANDS: retention=limits, max_age=180d, max_msg_size=256KiB)。
